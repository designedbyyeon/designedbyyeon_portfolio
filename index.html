<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>디자인드바이연 — 그래픽 디자이너 김도연</title>
  <meta name="description" content="그래픽 디자이너 김도연입니다. 한글 레터링을 주로 하고 있습니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="./" aria-label="디자인드바이연 홈">
      <img src="source/logo.svg" alt="디자인드바이연">
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      <button type="button" data-view="work" class="on">WORK</button>
      <button type="button" data-view="activity">ACTIVITY</button>
      <button type="button" data-contact>CONTACT</button>
    </nav>
  </header>

  <!-- 소개 문장 = 태그 필터. 태그를 고르면 고른 태그로만 된 문장이 또렷해진다 -->
  <section class="sentence" id="sentence" aria-label="태그 필터" aria-live="polite"></section>
  <div class="actions" id="actions">
    <p class="count" id="count"></p>
  </div>
  <!-- PDF 버튼: 스크립트가 문장의 끝으로 옮겨 붙인다 -->
  <button type="button" id="pdf-btn" class="pdf-btn"><span class="btn-label">PDF로 다운로드</span> ↓</button>

  <!-- 스크롤해서 문장이 안 보이면 위에 붙는 작은 태그 줄 -->
  <div class="mini" id="mini"></div>

  <main id="work" class="grid"></main>
  <!-- ACTIVITY: 워크숍·강의·아트프로젝트·대외활동. 한 활동 = 한 줄 (글 + 사진 여러 장) -->
  <section id="activity" class="acts" hidden></section>

  <!-- 연락처 창: contact.txt 내용으로 문장을 만든다 -->
  <dialog id="contact" class="contact" aria-label="연락처"></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="shared.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
