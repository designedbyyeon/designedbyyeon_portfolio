<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 4 — 에디토리얼 그리드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="common.css">
<style>
  :root { --g: 36px; --gap: 14px; --col: calc((100vw - 2 * var(--g) - 5 * var(--gap)) / 6); }
  body { background: #eff1f7; color: #111; font-size: 12px; }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px var(--g); border-bottom: 1px solid #d7dae4; }
  .top nav { display: flex; gap: 18px; }
  .top nav a:first-child { font-weight: 600; }
  .top img { height: 30px; width: auto; }
  .top .r { justify-self: end; text-decoration: underline; text-underline-offset: 3px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 16px var(--g) 30px; line-height: 1.6; }
  .filters .lbl { color: #9a9eab; font-size: 11px; letter-spacing: .04em; }
  .filters .list { display: flex; flex-direction: column; align-items: flex-start; }
  .genre-list { display: grid !important; grid-template-columns: repeat(2, max-content); column-gap: 24px; }
  .tag { text-align: left; }
  .has-sel .tag:not(.on) { color: #a9adb9; }
  .tag.on { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--c, #111); text-decoration-thickness: 2px; }

  /* 6칸 그리드 위에 크고 작은 이미지를 비대칭으로, 빈칸도 일부러 남김 */
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: calc(var(--col) * 2 / 3);
    gap: var(--gap);
    padding: 0 var(--g) 140px;
  }
  .it { position: relative; overflow: hidden; background: #dde0ea; cursor: pointer; }
  .it img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
  .it:hover img { transform: scale(1.02); }
  .it .cap { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; justify-content: space-between; color: #fff; font-size: 11px; text-shadow: 0 0 6px rgb(0 0 0 / .45); }
  .txt { font-size: 12px; line-height: 1.5; color: #333; overflow: hidden; white-space: pre-line; }
  .txt b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="top">
  <nav><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></nav>
  <img src="../source/logo.svg" alt="디자인드바이연">
  <a class="r" href="#">PDF로 다운로드</a>
</div>
<div class="filters" id="filters">
  <div><div class="lbl">작업 종류</div><div class="list" id="kinds"></div></div>
  <div><div class="lbl">장르</div><div class="list genre-list" id="genres"></div></div>
  <div style="justify-self:end;text-align:right"><div class="lbl">정렬</div><div>최신순 ↘</div><div id="count" style="color:#9a9eab;margin-top:6px"></div></div>
</div>
<main class="grid" id="grid"></main>
<script src="common.js"></script>
<script>
// 한 블록(12줄) 안의 자리: [열, 행, 가로칸, 세로칸] — 이미지 11개 + 글 상자 2개
const SLOTS = [
  [1, 1, 1, 2], [4, 1, 2, 4], [6, 1, 1, 2],
  [1, 4, 2, 4], [3, 4, 1, 2], [6, 5, 1, 2],
  [2, 9, 1, 2], [3, 9, 1, 2], [4, 9, 2, 4], [1, 11, 1, 2], [6, 11, 1, 2],
];
const TEXTS = [[0, [2, 1, 1, 2]], [4, [3, 6, 1, 2]]]; // [몇 번째 이미지의 설명, 자리]
const BLOCK = 13;
const pos = ([c, r, cs, rs], b) => `grid-column:${c}/span ${cs};grid-row:${r + b * BLOCK}/span ${rs}`;

(async () => {
  await P.load();
  const tagBtn = (t) => `<button class="tag" data-t="${P.esc(t)}" style="--c:${P.colorOf.get(t) || "#111"}">${P.esc(t)}</button>`;
  kinds.innerHTML = P.kinds.map(tagBtn).join("");
  genres.innerHTML = P.genres.map(tagBtn).join("");
  document.addEventListener("click", (e) => { const b = e.target.closest(".tag"); if (b) P.toggle(b.dataset.t); });

  const render = () => {
    filters.classList.toggle("has-sel", P.sel.size > 0);
    document.querySelectorAll(".tag").forEach((b) => b.classList.toggle("on", P.sel.has(b.dataset.t)));
    const list = P.visible();
    count.textContent = `${list.length}개 작업`;
    let html = "";
    list.forEach((w, i) => {
      const b = Math.floor(i / SLOTS.length), k = i % SLOTS.length;
      html += `<div class="it" style="${pos(SLOTS[k], b)}"><img src="${P.cover(w)}" alt="" loading="lazy">
        <div class="cap"><span>${P.esc(w.title)}</span><span>${w.year}</span></div></div>`;
      const t = TEXTS.find(([n]) => n === k);
      if (t) html += `<div class="txt" style="${pos(t[1], b)}"><b>${P.esc(w.title)}</b>${P.esc(w.description ? w.description.slice(0, 120) : [w.client, w.tags.join(" · ")].filter(Boolean).join("\n"))}</div>`;
    });
    grid.innerHTML = html;
  };
  P.onChange(render);
  render();
})();
</script>
</body>
</html>
