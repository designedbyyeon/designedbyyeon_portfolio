<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 2 — 아치 스트립</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #f2efec; color: #1a1a1a; display: flex; flex-direction: column; }
  header { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 40px; padding: 28px 36px 0; }
  .logo img { width: 230px; }
  .intro { font-size: 13px; line-height: 1.6; color: #555; max-width: 360px; }
  .intro b { display: block; color: #1a1a1a; font-weight: 600; }
  .tags { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; color: #1a1a1a; }
  .tag::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1px solid #999; background: var(--c, transparent); }
  .tag.on::before { border-color: #1a1a1a; box-shadow: inset 0 0 0 2px #f2efec; background: var(--c, #1a1a1a); }
  .has-sel .tag:not(.on) { color: #aaa; }
  nav { justify-self: end; text-align: right; font: 11px/1.9 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em; }
  nav a { display: block; }

  /* 아래쪽에 붙은 가로 스트립: 가운데가 가장 크고 양옆으로 갈수록 작아짐 */
  .strip {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 0 45vw 36px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .card { flex: none; display: flex; flex-direction: column; cursor: pointer; }
  .card .t { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; margin-bottom: 8px; white-space: nowrap; overflow: hidden; }
  .card .t::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1px solid #888; }
  .card .img { border-radius: 6px; overflow: hidden; background: #e2ddd8; }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .hint { position: fixed; right: 36px; bottom: 70px; font-size: 11px; color: #999; }
</style>
</head>
<body>
<header>
  <a class="logo" href="#"><img src="../source/logo.svg" alt="디자인드바이연"></a>
  <div>
    <p class="intro"><b>한글 레터링 디자이너 김도연</b>그래픽 디자이너 김도연입니다. 한글 레터링을 주로 하고 있습니다. 광고, 방송, 엔터테인먼트 등 다양한 분야의 타이틀과 로고를 만듭니다.</p>
    <div class="tags" id="tags"></div>
  </div>
  <nav><a href="#">WORK +</a><a href="#">ABOUT</a><a href="#">CONTACT</a><a href="#">PDF ↓</a></nav>
</header>
<main class="strip" id="strip"></main>
<div class="hint">스크롤 / 드래그 →</div>
<script src="common.js"></script>
<script>
(async () => {
  await P.load();
  tags.innerHTML = [...P.kinds, ...P.genres].map((t) => `<button class="tag" data-t="${P.esc(t)}"${P.colorOf.get(t) ? ` style="--c:${P.colorOf.get(t)}"` : ""}>${P.esc(t)}</button>`).join("");
  document.addEventListener("click", (e) => { const b = e.target.closest(".tag"); if (b) P.toggle(b.dataset.t); });

  // 화면 가운데와의 거리로 카드 크기 결정
  const size = () => {
    const mid = innerWidth / 2;
    const maxH = Math.min(innerHeight * 0.52, 520);
    strip.querySelectorAll(".card").forEach((c) => {
      const r = c.getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - mid) / mid; // 0(가운데) ~ 1(끝)
      const h = maxH * Math.max(0.3, 1 - d * 0.75);
      const img = c.querySelector(".img");
      img.style.height = `${h}px`;
      img.style.width = `${h * 0.75}px`;
      c.style.opacity = Math.max(0.35, 1 - Math.max(0, d - 0.7) * 2);
    });
  };
  const render = () => {
    document.querySelector("header").classList.toggle("has-sel", P.sel.size > 0);
    document.querySelectorAll(".tag").forEach((b) => b.classList.toggle("on", P.sel.has(b.dataset.t)));
    strip.innerHTML = P.visible().map((w) => `
      <div class="card"><div class="t">${P.esc(w.title)}</div><div class="img"><img src="${P.cover(w)}" alt="" loading="lazy"></div></div>`).join("");
    strip.scrollLeft = 0;
    size();
  };
  strip.addEventListener("scroll", () => requestAnimationFrame(size));
  // 세로 휠 → 가로 스크롤
  addEventListener("wheel", (e) => { strip.scrollLeft += e.deltaY + e.deltaX; e.preventDefault(); }, { passive: false });
  addEventListener("resize", size);
  P.onChange(render);
  render();
})();
</script>
</body>
</html>
