<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파비콘 · 공유 이미지 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body { margin: 0; padding: 48px; background: #f1f1f1; font-family: "Pretendard Variable", sans-serif; color: #111; }
  h2 { font-size: 18px; margin: 56px 0 6px; }
  h2:first-child { margin-top: 0; }
  p.note { margin: 0 0 20px; color: #777; font-size: 13px; }
  .fav-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; max-width: 1100px; }
  .fav { background: #fff; border-radius: 12px; padding: 20px; }
  .fav h3 { margin: 0 0 4px; font-size: 15px; }
  .fav .desc { margin: 0 0 16px; font-size: 12px; color: #777; line-height: 1.5; min-height: 36px; }
  .sizes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
  .sizes div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10px; color: #999; }
  /* 브라우저 탭 흉내 */
  .tab { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding: 8px 12px; background: #e9e9e9; border-radius: 8px 8px 0 0; font-size: 12px; width: fit-content; }
  .tab.dark { background: #2b2b2b; color: #ddd; }
  .og-row { display: grid; grid-template-columns: 1fr; gap: 28px; }
  .og { display: grid; grid-template-columns: 600px 1fr; gap: 24px; align-items: start; }
  .og .card { width: 600px; height: 315px; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
  .og h3 { margin: 0 0 6px; font-size: 15px; }
  .og .desc { font-size: 13px; color: #666; line-height: 1.6; margin: 0; }
  /* 카카오톡 링크 미리보기 흉내 */
  .kakao { margin-top: 14px; width: 260px; background: #fff; border-radius: 10px; overflow: hidden; font-size: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
  .kakao .thumb { width: 260px; height: 136px; overflow: hidden; }
  .kakao .thumb > * { transform: scale(.21667); transform-origin: 0 0; }
  .kakao .txt { padding: 10px 12px; }
  .kakao b { display: block; margin-bottom: 2px; }
  .kakao span { color: #888; }
</style>
</head>
<body>
<h2>파비콘 (브라우저 탭·북마크·폰 홈 화면 아이콘)</h2>
<p class="note">실제 크기로 보여드려요. 16px·32px는 브라우저 탭, 180px는 아이폰 홈 화면 아이콘 크기예요.</p>
<div class="fav-row" id="favs"></div>

<h2>공유 이미지 (카카오톡·메신저·SNS에 링크를 보낼 때 뜨는 카드, 1200×630)</h2>
<p class="note">왼쪽은 절반 크기, 오른쪽 작은 카드는 카카오톡에서 보이는 모습을 흉내 낸 거예요.</p>
<div class="og-row" id="ogs"></div>

<script>
const KIND = ["#edc92f", "#5ece3e", "#f49ac1", "#4960ea", "#ea522f"]; // 한글레터링·영문레터링·포스터·모션그래픽·3D
const BG = "#fcfcfc";

(async () => {
  const text = await (await fetch("../source/logo.svg")).text();
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const paths = [...doc.querySelectorAll("path")].map((p) => ({ d: p.getAttribute("d"), by: p.getAttribute("class") === "cls-1" }));
  // 획을 왼쪽부터 정렬하기 위해 한 번 그려서 위치를 잰다
  const probe = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  probe.style.cssText = "position:absolute;visibility:hidden";
  document.body.append(probe);
  paths.forEach((p) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.setAttribute("d", p.d); probe.append(el);
    const b = el.getBBox(); Object.assign(p, { x: b.x, y: b.y, w: b.width, h: b.height });
  });
  probe.remove();
  const byPaths = paths.filter((p) => p.by).sort((a, b) => a.x - b.x);
  const yeon = paths.filter((p) => !p.by).sort((a, b) => b.x - a.x)[0]; // 맨 오른쪽 = '연'

  // 정사각 아이콘: viewBox 안에 획들을 가운데 정렬
  const box = (ps, pad) => {
    const x0 = Math.min(...ps.map((p) => p.x)), y0 = Math.min(...ps.map((p) => p.y));
    const x1 = Math.max(...ps.map((p) => p.x + p.w)), y1 = Math.max(...ps.map((p) => p.y + p.h));
    const s = Math.max(x1 - x0, y1 - y0) * (1 + pad * 2);
    return [(x0 + x1) / 2 - s / 2, (y0 + y1) / 2 - s / 2, s, s];
  };
  const icon = ({ ps, fills, bg, radius = 0.22, pad = 0.12 }) => {
    const [x, y, s] = box(ps, pad);
    return (size) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="${x} ${y} ${s} ${s}">
      ${bg ? `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s * radius}" fill="${bg}"/>` : ""}
      ${ps.map((p, i) => `<path d="${p.d}" fill="${fills[i % fills.length]}"/>`).join("")}</svg>`;
  };

  const FAVS = [
    { t: "A. 무지개 [바이]", d: "[바이]의 5획을 작업 종류 5색으로. 로고 색이 바뀌는 사이트 컨셉을 그대로 담아요.", mk: icon({ ps: byPaths, fills: KIND, bg: BG }) },
    { t: "B. 노랑 [바이]", d: "대표 색(한글레터링 노랑) 바탕에 검정 [바이]. 탭에서 가장 눈에 잘 띄어요.", mk: icon({ ps: byPaths, fills: ["#111"], bg: "#edc92f" }) },
    { t: "C. 검정 [바이]", d: "검정 바탕에 흰 [바이]. 가장 단정하고 어떤 탭 색에서도 또렷해요.", mk: icon({ ps: byPaths, fills: ["#fff"], bg: "#111" }) },
    { t: "D. [연]", d: "이름 '연' 한 글자. 획이 굵어 작은 크기에서 가장 잘 읽혀요.", mk: icon({ ps: [yeon], fills: ["#111"], bg: "#edc92f", pad: 0.16 }) },
  ];
  favs.innerHTML = FAVS.map((f) => `
    <div class="fav"><h3>${f.t}</h3><p class="desc">${f.d}</p>
      <div class="sizes">${[16, 32, 64, 180].map((s) => `<div>${f.mk(s)}${s}px</div>`).join("")}</div>
      <div class="tab">${f.mk(16)} 디자인드바이연 — 그래픽 디자이너…</div>
      <div class="tab dark">${f.mk(16)} 디자인드바이연 — 그래픽 디자이너…</div>
    </div>`).join("");

  // 공유 이미지 (1200×630을 절반 크기로 표시)
  const logo = (fillMain, fillBy, w) => {
    const bys = [];
    const s = paths.map((p) => {
      let f = fillMain;
      if (p.by) { const i = byPaths.indexOf(p); f = Array.isArray(fillBy) ? fillBy[i % fillBy.length] : fillBy; }
      return `<path d="${p.d}" fill="${f}"/>`;
    }).join("");
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470.17 659.86" width="${w}">${s}</svg>`;
  };
  const pill = (t, c, fg = "#000") => `<span style="display:inline-block;padding:10px 26px 12px;border-radius:999px;background:${c};color:${fg};font-weight:700;font-size:30px;margin:0 6px 12px 0">${t}</span>`;
  const OGS = [
    { t: "1. 로고 + 한 줄 소개", d: "밝은 배경에 로고를 크게, [바이]는 노랑. 사이트 첫 화면과 같은 인상이에요. 가장 무난해요.",
      html: `<div style="width:1200px;height:630px;background:${BG};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;font-family:'Pretendard Variable'">
        ${logo("#000", "#edc92f", 620)}<div style="font-size:34px;font-weight:600;color:#9a9a9a">그래픽 디자이너 김도연 · 한글 레터링</div></div>` },
    { t: "2. 문장형 (사이트 그대로)", d: "로고와 태그 알약 문장을 그대로 옮겼어요. 어떤 사이트인지(여러 분야, 태그로 골라 보기)가 카드에서 바로 전달돼요. 추천해요.",
      html: `<div style="width:1200px;height:630px;background:${BG};padding:70px 80px;box-sizing:border-box;font-family:'Pretendard Variable';letter-spacing:-0.02em">
        ${logo("#000", "#666", 440)}
        <div style="margin-top:46px;font-size:30px;font-weight:600;color:#b8b8b8;margin-bottom:14px">그래픽 디자이너 김도연입니다.</div>
        <div>${pill("한글레터링", KIND[0])}${pill("영문레터링", KIND[1])}${pill("포스터", KIND[2])}${pill("모션그래픽", KIND[3])}${pill("3D", KIND[4])}</div>
        <div>${pill("광고", "#d6d6d6")}${pill("방송/영화", "#d6d6d6")}${pill("엔터테인먼트", "#d6d6d6")}${pill("웹툰", "#d6d6d6")}<span style="font-size:30px;font-weight:600;color:#b8b8b8">…</span></div></div>` },
    { t: "3. 검정 + 무지개 [바이]", d: "검정 배경에 흰 로고, [바이]만 5색. 피드에서 가장 눈에 띄고 파비콘 A와 짝이 맞아요.",
      html: `<div style="width:1200px;height:630px;background:#111;display:flex;align-items:center;justify-content:center">${logo("#fff", KIND, 760)}</div>` },
  ];
  ogs.innerHTML = OGS.map((o) => `
    <div class="og">
      <div class="card"><div style="transform:scale(.5);transform-origin:0 0">${o.html}</div></div>
      <div><h3>${o.t}</h3><p class="desc">${o.d}</p>
        <div class="kakao"><div class="thumb">${o.html}</div><div class="txt"><b>디자인드바이연 — 그래픽 디자이너 김도연</b><span>그래픽 디자이너 김도연입니다. 한글 레터링을 주로…</span><br><span>designedbyyeon.com</span></div></div>
      </div>
    </div>`).join("");
})();
</script>
</body>
</html>
